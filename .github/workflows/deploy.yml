name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so the live GitHub data (repos, stars, READMEs) stays fresh
  # without anyone pushing a commit.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions: {}

# One deployment at a time; let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Authenticated GitHub API → ~5000 req/h instead of 60.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
