name: Temporary dependency and formatting bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate locked dependencies and format tests
        run: |
          npm install --ignore-scripts
          npx prettier --write package.json playwright.config.mjs tests/browser tests/unit tests/TESTING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json playwright.config.mjs tests
          git commit -m 'Regenerate locked browser test dependencies and formatting'
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
