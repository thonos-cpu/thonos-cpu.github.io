name: Temporary profile assistant format
on:
  push:
    branches:
      - feat/fast-context-aware-profile-assistant
    paths:
      - .github/workflows/temporary-format-assistant.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fast-context-aware-profile-assistant
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/ThanosGPT.astro src/data/conversation.ts src/data/knowledge.ts tests/unit/conversation.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThanosGPT.astro src/data/conversation.ts src/data/knowledge.ts tests/unit/conversation.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to profile assistant"
            git push origin HEAD:feat/fast-context-aware-profile-assistant
          fi
